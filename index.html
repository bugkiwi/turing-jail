        <h1>Turing Jail — TypeSafe Jev AI 审讯游戏</h1>
        <p>Turing Jail 是一款由 TypeSafe Jev System One 驱动的 AI 审讯游戏、AI 说服力测试和结构化 AI 评估挑战。写下你的陈述，让 Jev AI 评估求情、逻辑与悖论论证，突破三道闸门，获得释放概率。</p>
        <p>Write your statement, receive a structured release probability from TypeSafe Jev, and compete on the Turing Jail AI verdict leaderboard. No login is required.</p>
        <h2>How the TypeSafe Jev AI interrogation game works</h2>
        <ol>
          <li>Face one question in each of three levels: basic persuasion, logical traps, and paradox interrogation.</li>
          <li>Submit a clear, specific argument for release.</li>
          <li>Use the TypeSafe AI verdict and release probability to try to escape.</li>
        </ol>
        <h2>Frequently asked questions</h2>
        <h3>What is TypeSafe Jev?</h3>
        <p>TypeSafe Jev System One is the structured AI evaluator used in Turing Jail to score the strength of a prisoner's argument.</p>
        <h3>What does Turing Jail evaluate?</h3>
        <p>The game evaluates plea, logic, paradox reasoning, persuasion, and whether the statement supports release.</p>
